---
# Package updates role defaults.
#
# Supported platforms for this iteration: RHEL / AlmaLinux / Rocky 8-9.
# Debian/Ubuntu support is being reworked separately.

# What to update:
#   "all"      - all available package updates
#   "security" - security updates only
#   "specific" - only packages from package_updates_specific_list
#   "none"     - no updates, only lock management
package_updates_mode: "security"

# How to treat packages from package_updates_lock_list:
#   "exclude" - do not update locked packages
#   "include" - update all selected packages, including locked ones,
#               then restore locks
#   "only"    - update only locked packages, then restore locks
package_updates_locked_policy: "exclude"

# Packages to lock before updating. These packages are the single source of
# truth for lock management; versionlock entries that are not present in the
# lock or unlock lists are not modified by the role.
package_updates_lock_list: []

# Packages whose locks should be removed before updating.
# A package must not be present in both lock and unlock lists.
package_updates_unlock_list: []

# Packages to update when package_updates_mode is "specific".
# Items can be package names or dictionaries with "name" and optional "version":
#   package_updates_specific_list:
#     - nginx
#     - name: openssl
#       version: "3.0.13-1ubuntu1.1"
package_updates_specific_list: []

# Refresh the package manager metadata cache before running package operations.
package_updates_refresh_cache: true

# When true, only already installed packages are updated in "specific" mode.
package_updates_only_installed: true
