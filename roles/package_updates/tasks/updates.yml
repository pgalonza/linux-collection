---
# Perform package updates according to mode and locked-package policy.

- name: Perform package updates
  when: package_updates_mode != 'none'
  block:
    - name: Temporarily unlock packages for the current transaction
      community.general.dnf_versionlock:
        name: "{{ package_updates_lock_list }}"
        state: absent
      when:
        - package_updates_locked_policy in ['include', 'only']
        - package_updates_lock_list | length > 0

    - name: Update all packages  # noqa: package-latest
      ansible.builtin.dnf:
        name: '*'
        state: latest
        update_cache: false
      when:
        - package_updates_mode == 'all'
        - package_updates_locked_policy in ['exclude', 'include']

    - name: Update security packages  # noqa: package-latest
      ansible.builtin.dnf:
        name: '*'
        security: true
        state: latest
        update_cache: false
      when:
        - package_updates_mode == 'security'
        - package_updates_locked_policy in ['exclude', 'include']

    - name: Update only locked packages
      ansible.builtin.dnf:
        name: "{{ package_updates_lock_list }}"
        state: latest
        update_only: true
        update_cache: false
      when:
        - package_updates_mode == 'all'
        - package_updates_locked_policy == 'only'
        - package_updates_lock_list | length > 0

    - name: Update only locked security packages
      ansible.builtin.dnf:
        name: "{{ package_updates_lock_list }}"
        security: true
        state: latest
        update_only: true
        update_cache: false
      when:
        - package_updates_mode == 'security'
        - package_updates_locked_policy == 'only'
        - package_updates_lock_list | length > 0

    - name: Update specific packages
      ansible.builtin.dnf:
        name: "{{ item.name | default(item) }}"
        state: "{{ 'present' if (item.version | default('') | length > 0) else 'latest' }}"
        version: "{{ item.version | default(omit, true) }}"
        update_only: "{{ package_updates_only_installed | bool }}"
        update_cache: false
      loop: "{{ package_updates_specific_list }}"
      loop_control:
        label: "{{ item.name | default(item) }}"
      when:
        - package_updates_mode == 'specific'
        - >-
          package_updates_locked_policy == 'include'
          or (package_updates_locked_policy == 'only' and (item.name | default(item)) in package_updates_lock_list)
          or (package_updates_locked_policy == 'exclude' and (item.name | default(item)) not in package_updates_lock_list)

  always:
    - name: Restore package locks
      community.general.dnf_versionlock:
        name: "{{ package_updates_lock_list }}"
        state: present
      when:
        - package_updates_locked_policy in ['include', 'only']
        - package_updates_lock_list | length > 0
