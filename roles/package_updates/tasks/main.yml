---
# Package updates role entry point.
# Supported platforms for this iteration: RHEL / AlmaLinux / Rocky 8-9.

- name: Import facts tasks
  ansible.builtin.import_tasks: facts.yml
  tags: always

- name: Import update cache tasks
  ansible.builtin.import_tasks: update_cache.yml
  tags:
    - package-updates
    - package-lock
    - package-unlock
    - package-locked

- name: Import install plugins tasks
  ansible.builtin.import_tasks: install_plugins.yml
  tags:
    - package-updates
    - package-lock
    - package-unlock
    - package-locked

- name: Import unlock packages tasks
  ansible.builtin.import_tasks: unlock.yml
  tags:
    - package-updates
    - package-unlock

- name: Import lock packages tasks
  ansible.builtin.import_tasks: lock.yml
  tags:
    - package-updates
    - package-lock

- name: Import package updates tasks
  ansible.builtin.import_tasks: updates.yml
  tags: package-updates

- name: Import show locked packages tasks
  ansible.builtin.import_tasks: show_locked.yml
  tags: package-locked
