---
# Manual test playbook for the package_updates role.
# Run only on RHEL / AlmaLinux / Rocky 8-9.

- name: Test package lock management
  hosts: localhost
  remote_user: root
  gather_facts: false
  vars:
    package_updates_mode: "none"
    package_updates_lock_list:
      - python3
  roles:
    - package_updates
